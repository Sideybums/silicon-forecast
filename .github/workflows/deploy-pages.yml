name: Production deployment locked

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SF_PUBLIC_SERIES: withheld

jobs:
  refuse-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm production deployment remains locked
        run: npm run deploy
